
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>응급 의료 지도</title>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=dbebb8cfdf21e6d5fe4adcd94d3a027f&libraries=services"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #26382f;
      background: #f3f7f4;
    }

    header {
      padding: 22px;
      color: white;
      background: #176b52;
    }

    header h1 {
      margin: 0 0 7px;
      font-size: 25px;
    }

    header p {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .search-area {
      display: flex;
      gap: 8px;
      padding: 15px 18px;
      background: white;
      border-bottom: 1px solid #e0e8e2;
    }

    .search-area input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #d4e1d8;
      border-radius: 9px;
      font-size: 14px;
      outline-color: #176b52;
    }

    button {
      padding: 11px 15px;
      border: 1px solid #d4e1d8;
      border-radius: 9px;
      background: white;
      color: #315747;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover { background: #eaf4ed; }

    .search-button {
      color: white;
      background: #176b52;
      border-color: #176b52;
    }

    .search-button:hover { background: #10553f; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      padding: 12px 18px;
      background: white;
      border-bottom: 1px solid #e0e8e2;
    }

    .toolbar button.active {
      color: white;
      background: #176b52;
      border-color: #176b52;
    }

    .toolbar #pharmacyBtn.active {
      background: #3476cf;
      border-color: #3476cf;
    }

    .main {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 15px;
      padding: 15px;
      height: calc(100vh - 205px);
      min-height: 440px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background: white;
      border: 1px solid #e0e8e2;
      border-radius: 13px;
    }

    .sidebar-heading {
      padding: 17px;
      border-bottom: 1px solid #e8eee9;
    }

    .sidebar-heading h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    #status {
      color: #65766b;
      font-size: 13px;
      line-height: 1.6;
    }

    #results {
      overflow-y: auto;
      padding: 8px;
    }

    .place-item {
      display: block;
      width: 100%;
      margin-bottom: 7px;
      padding: 13px;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 9px;
    }

    .place-item:hover { border-color: #cfe2d4; }

    .place-item strong {
      display: block;
      margin-bottom: 6px;
      color: #254b3b;
      font-size: 14px;
    }

    .place-item span {
      display: block;
      color: #68796e;
      font-size: 12px;
      line-height: 1.6;
    }

    .map-wrap {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid #e0e8e2;
      border-radius: 13px;
      background: #e7eee8;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-note {
      position: absolute;
      z-index: 2;
      bottom: 12px;
      left: 12px;
      max-width: calc(100% - 24px);
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 8px #0002;
      font-size: 12px;
      line-height: 1.6;
    }

    .info-window {
      width: 225px;
      padding: 12px;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    .info-window strong {
      display: block;
      margin-bottom: 8px;
      color: #176b52;
      font-size: 15px;
    }

    .info-window p {
      margin: 5px 0;
      color: #4e6055;
      font-size: 12px;
      line-height: 1.6;
    }

    .info-window a {
      display: inline-block;
      margin-top: 8px;
      color: #176b52;
      font-size: 13px;
      font-weight: bold;
    }

    @media (max-width: 760px) {
      .main {
        grid-template-columns: 1fr;
        height: auto;
      }

      .map-wrap {
        height: 50vh;
        min-height: 300px;
        grid-row: 1;
      }

      .sidebar { height: 350px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>🩺 응급 의료 지도</h1>
    <p>진료과나 의료기관 이름을 검색하고 주변 의료기관을 확인하세요.</p>
  </header>

  <form id="searchForm" class="search-area">
    <input
      id="searchInput"
      type="search"
      placeholder="예: 내과, 치과, 세브란스병원"
      autocomplete="off"
    >
    <button class="search-button" type="submit">검색</button>
  </form>

  <nav class="toolbar">
    <button id="hospitalBtn" class="active"
      onclick="changeCategory('hospital')">
      🏥 병원
    </button>

    <button id="pharmacyBtn"
      onclick="changeCategory('pharmacy')">
      💊 약국
    </button>

    <button onclick="moveToMyLocation()">📍 내 위치</button>

    <button id="trafficBtn" onclick="toggleTraffic()">
      🚦 교통정보 켜기
    </button>
  </nav>

  <main class="main">
    <section class="sidebar">
      <div class="sidebar-heading">
        <h2 id="listTitle">주변 병원</h2>
        <div id="status">현재 위치를 확인하고 있습니다.</div>
      </div>
      <div id="results"></div>
    </section>

    <section class="map-wrap">
      <div id="map"></div>
      <div class="map-note">
        마커를 선택하면 주소와 상세 정보를 확인할 수 있어요.
        응급실 운영 여부는 별도로 확인해야 합니다.
      </div>
    </section>
  </main>

  <script>
    // 탭별 카테고리 코드
    const CATEGORY_CODES = {
      hospital: "HP8",
      pharmacy: "PM9"
    };

    let currentCategory = "hospital";
    let userPosition = null;
    let trafficEnabled = false;
    let searchVersion = 0;
    let markers = [];

    const defaultPosition = new kakao.maps.LatLng(
      37.5665, 126.9780
    );

    const map = new kakao.maps.Map(
      document.getElementById("map"),
      {
        center: defaultPosition,
        level: 5
      }
    );

    const placesService = new kakao.maps.services.Places(map);

    const infoWindow = new kakao.maps.InfoWindow({
      zIndex: 10
    });

    // 검색창 제출: Enter 또는 검색 버튼
    document.getElementById("searchForm").addEventListener(
      "submit",
      function(event) {
        event.preventDefault();
        searchPlaces();
      }
    );

    // 처음에는 현재 위치를 기준으로 검색
    requestCurrentLocation();

    function requestCurrentLocation() {
      setStatus("현재 위치를 확인하고 있습니다.");

      if (!navigator.geolocation) {
        setStatus("위치 기능을 사용할 수 없어 서울시청을 기준으로 검색합니다.");
        searchPlaces();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          userPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.setCenter(userPosition);
          map.setLevel(5);
          searchPlaces();
        },
        function(error) {
          console.warn("위치 확인 실패:", error);
          map.setCenter(defaultPosition);
          setStatus("현재 위치를 가져오지 못해 서울시청을 기준으로 검색합니다.");
          searchPlaces();
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 검색어가 있으면 키워드 검색 후 카테고리로 필터링.
    // 검색어가 없으면 해당 카테고리 주변 검색.
    function searchPlaces() {
      const version = ++searchVersion;
      const query = document.getElementById("searchInput")
        .value.trim();

      const center = map.getCenter();
      const categoryCode = CATEGORY_CODES[currentCategory];
      const categoryName =
        currentCategory === "hospital" ? "병원" : "약국";

      clearMarkers();
      document.getElementById("results").innerHTML = "";
      document.getElementById("listTitle").textContent =
        query ? "'" + query + "' 검색 결과" : "주변 " + categoryName;

      setStatus("검색 중입니다...");

      const options = {
        location: center,
        radius: 10000,
        sort: kakao.maps.services.SortBy.DISTANCE,
        size: 15
      };

      if (query) {
        // 진료과나 기관명 검색
        placesService.keywordSearch(
          query,
          function(data, status, pagination) {
            if (version !== searchVersion) return;

            if (status === kakao.maps.services.Status.OK) {
              // 검색 결과에서 선택한 카테고리만 남김
              const filtered = data.filter(function(place) {
                return place.category_group_code === categoryCode;
              });

              console.log("검색어:", query);
              console.log("선택 카테고리:", categoryCode);
              console.log("원본 결과:", data);
              console.log("필터링 결과:", filtered);

              displayPlaces(filtered, version);

              if (filtered.length === 0) {
                setStatus(
                  "검색 결과에서 해당 카테고리의 장소를 찾지 못했습니다. 다른 검색어를 입력해 보세요."
                );
              } else {
                setStatus(
                  categoryName + " 검색 결과 " +
                  filtered.length + "곳 · 반경 약 10km"
                );
              }
            } else if (
              status === kakao.maps.services.Status.ZERO_RESULT
            ) {
              setStatus("검색 결과가 없습니다. 다른 검색어를 입력해 보세요.");
            } else {
              console.error("키워드 검색 오류:", status);
              setStatus("검색에 실패했습니다. API 설정을 확인해 주세요.");
            }
          },
          options
        );
      } else {
        // 검색어가 비어 있으면 카테고리별 주변 검색
        placesService.categorySearch(
          categoryCode,
          function(data, status, pagination) {
            if (version !== searchVersion) return;

            if (status === kakao.maps.services.Status.OK) {
              displayPlaces(data, version);
              setStatus(
                "주변 " + categoryName + " " +
                data.length + "곳 · 반경 약 10km"
              );
            } else if (
              status === kakao.maps.services.Status.ZERO_RESULT
            ) {
              setStatus("주변에서 검색 결과를 찾지 못했습니다.");
            } else {
              console.error("카테고리 검색 오류:", status);
              setStatus("검색에 실패했습니다. API 설정을 확인해 주세요.");
            }
          },
          options
        );
      }
    }

    // 지도 마커와 목록 생성
    function displayPlaces(places, version) {
      if (version !== searchVersion) return;

      const results = document.getElementById("results");
      results.innerHTML = "";

      const isHospital = currentCategory === "hospital";
      const markerColor = isHospital ? "#16815c" : "#3476cf";

      places.forEach(function(place, index) {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          title: place.place_name
        });

        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg"
               width="36" height="36" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="15"
                    fill="${markerColor}"
                    stroke="white" stroke-width="3"/>
            ${
              isHospital
                ? '<path d="M15 9h6v6h6v6h-6v6h-6v-6H9v-6h6z" fill="white"/>'
                : '<path d="M12 9h12v18H12z" fill="white"/><path d="M9 15h18v6H9z" fill="white"/>'
            }
          </svg>
        `;

        marker.setImage(
          new kakao.maps.MarkerImage(
            "data:image/svg+xml;charset=utf-8," +
              encodeURIComponent(svg),
            new kakao.maps.Size(36, 36),
            { offset: new kakao.maps.Point(18, 18) }
          )
        );

        markers.push(marker);

        kakao.maps.event.addListener(marker, "click", function() {
          showPlaceInfo(place, marker);
        });

        const item = document.createElement("button");
        item.className = "place-item";

        const name = document.createElement("strong");
        name.textContent = (index + 1) + ". " + place.place_name;

        const category = document.createElement("span");
        category.textContent = place.category_name || categoryName();

        const address = document.createElement("span");
        address.textContent =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        item.appendChild(name);
        item.appendChild(category);
        item.appendChild(address);

        item.addEventListener("click", function() {
          map.panTo(position);
          map.setLevel(3);
          showPlaceInfo(place, marker);
        });

        results.appendChild(item);
      });
    }

    function categoryName() {
      return currentCategory === "hospital" ? "병원" : "약국";
    }

    function showPlaceInfo(place, marker) {
      const address =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      const mapUrl = place.place_url ||
        "https://map.kakao.com/link/search/" +
        encodeURIComponent(place.place_name);

      const content = `
        <div class="info-window">
          <strong>${escapeHTML(place.place_name)}</strong>
          <p>주소: ${escapeHTML(address)}</p>
          <p>${
            currentCategory === "hospital"
              ? "응급실 운영 여부는 별도로 확인해 주세요."
              : "운영시간을 별도로 확인해 주세요."
          }</p>
          <a href="${escapeHTML(mapUrl)}"
             target="_blank"
             rel="noopener noreferrer">
            카카오맵 상세 정보 보기 ↗
          </a>
        </div>
      `;

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, function(char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    function clearMarkers() {
      markers.forEach(function(marker) {
        marker.setMap(null);
      });

      markers = [];
      infoWindow.close();
    }

    function changeCategory(category) {
      currentCategory = category;

      document.getElementById("hospitalBtn").classList.toggle(
        "active", category === "hospital"
      );

      document.getElementById("pharmacyBtn").classList.toggle(
        "active", category === "pharmacy"
      );

      // 기존 검색어는 유지한 채 탭에 맞게 다시 검색
      searchPlaces();
    }

    function moveToMyLocation() {
      if (userPosition) {
        map.setCenter(userPosition);
        map.setLevel(5);
        searchPlaces();
      } else {
        requestCurrentLocation();
      }
    }

    function toggleTraffic() {
      trafficEnabled = !trafficEnabled;

      if (trafficEnabled) {
        map.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
      } else {
        map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
      }

      document.getElementById("trafficBtn").textContent =
        trafficEnabled
          ? "🚦 교통정보 끄기"
          : "🚦 교통정보 켜기";
    }

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }
  </script>
</body>
</html>
