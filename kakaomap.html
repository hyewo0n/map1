
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>응급 의료 지도</title>

  <dbebb8cfdf21e6d5fe4adcd94d3a027f>
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=dbebb8cfdf21e6d5fe4adcd94d3a027f&libraries=services">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #24352f;
      background: #f4f7f5;
    }

    header {
      padding: 22px 24px;
      color: white;
      background: #176b52;
    }

    header h1 {
      margin: 0 0 7px;
      font-size: 25px;
    }

    header p {
      margin: 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px 20px;
      background: white;
      border-bottom: 1px solid #e0e8e3;
    }

    button {
      padding: 11px 15px;
      border: 1px solid #d5e2da;
      border-radius: 9px;
      background: white;
      color: #315345;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s;
    }

    button:hover {
      background: #edf6f0;
    }

    button.active {
      color: white;
      background: #176b52;
      border-color: #176b52;
    }

    .main {
      display: grid;
      grid-template-columns: 350px minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
      height: calc(100vh - 145px);
      min-height: 500px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #e0e8e3;
      border-radius: 14px;
      background: white;
    }

    .sidebar-heading {
      padding: 18px;
      border-bottom: 1px solid #e8eee9;
    }

    .sidebar-heading h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    #status {
      color: #65776d;
      font-size: 13px;
      line-height: 1.5;
    }

    #results {
      overflow-y: auto;
      padding: 8px;
    }

    .hospital {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 7px;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 10px;
    }

    .hospital:hover {
      border-color: #cce3d5;
    }

    .hospital strong {
      display: block;
      margin-bottom: 7px;
      color: #244b3b;
      font-size: 15px;
    }

    .hospital span {
      display: block;
      color: #64766b;
      font-size: 12px;
      line-height: 1.6;
    }

    .map-wrap {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid #e0e8e3;
      border-radius: 14px;
      background: #e8eee9;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-note {
      position: absolute;
      z-index: 2;
      bottom: 12px;
      left: 12px;
      max-width: calc(100% - 24px);
      padding: 9px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 8px #00000015;
      font-size: 12px;
      line-height: 1.5;
    }

    .info-window {
      width: 230px;
      padding: 13px;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    .info-window strong {
      display: block;
      margin-bottom: 8px;
      color: #176b52;
      font-size: 15px;
    }

    .info-window p {
      margin: 5px 0;
      color: #4b5d53;
      font-size: 12px;
      line-height: 1.5;
    }

    .info-window a {
      display: inline-block;
      margin-top: 8px;
      color: #176b52;
      font-size: 13px;
      font-weight: bold;
    }

    @media (max-width: 760px) {
      .main {
        grid-template-columns: 1fr;
        height: auto;
      }

      .map-wrap {
        height: 52vh;
        min-height: 330px;
        grid-row: 1;
      }

      .sidebar {
        height: 350px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🩺 응급 의료 지도</h1>
    <p>주변 병원을 확인하고 신속한 이동을 위한 위치 정보를 확인하세요.</p>
  </header>

  <nav class="toolbar">
    <button id="allBtn" class="active" onclick="changeMode('all')">
      전체 병원
    </button>
    <button id="generalBtn" onclick="changeMode('general')">
      종합병원
    </button>
    <button onclick="moveToMyLocation()">
      📍 내 위치
    </button>
    <button id="trafficBtn" onclick="toggleTraffic()">
      🚦 교통정보 켜기
    </button>
    <button onclick="searchHospitals()">
      🔄 주변 병원 다시 검색
    </button>
  </nav>

  <main class="main">
    <section class="sidebar">
      <div class="sidebar-heading">
        <h2 id="listTitle">주변 병원</h2>
        <div id="status">병원 정보를 불러오는 중입니다.</div>
      </div>
      <div id="results"></div>
    </section>

    <section class="map-wrap">
      <div id="map"></div>
      <div class="map-note">
        병원 마커를 누르면 주소와 카카오맵 링크를 확인할 수 있어요.
        응급실 운영 여부는 별도로 확인해야 합니다.
      </div>
    </section>
  </main>

  <script>
    // 현재 선택한 탭
    let currentMode = "all";

    // 지도 및 장소 검색 객체
    let map;
    let placesService;
    let infoWindow;

    // 지도에 표시한 마커와 검색 버전
    let markers = [];
    let searchVersion = 0;
    let trafficEnabled = false;

    // 내 위치를 저장할 변수
    let userPosition = null;

    // 기본 위치: 서울시청
    const defaultPosition = new kakao.maps.LatLng(
      37.5665,
      126.9780
    );

    // 지도 초기화
    map = new kakao.maps.Map(document.getElementById("map"), {
      center: defaultPosition,
      level: 5
    });

    // ★ 지도 SDK의 HP8 카테고리 검색을 사용합니다.
    // 키워드 검색(keywordSearch)은 사용하지 않습니다.
    placesService = new kakao.maps.services.Places(map);

    infoWindow = new kakao.maps.InfoWindow({
      zIndex: 10
    });

    // 시작할 때 병원 검색
    searchHospitals();

    // 병원 카테고리 검색
    function searchHospitals() {
      const version = ++searchVersion;
      const center = map.getCenter();

      document.getElementById("status").textContent =
        "HP8 병원 카테고리로 검색 중입니다...";
      document.getElementById("results").innerHTML = "";

      placesService.categorySearch(
        "HP8",
        function(data, status, pagination) {
          // 이전 검색 결과가 늦게 도착한 경우 무시
          if (version !== searchVersion) return;

          if (status === kakao.maps.services.Status.OK) {
            console.log("HP8 카테고리 검색 성공", data);

            let filtered = data;

            // 종합병원 탭에서는 분류 정보에 '종합병원'이 있는
            // 결과만 보여줍니다.
            if (currentMode === "general") {
              filtered = data.filter(function(place) {
                return (place.category_name || "")
                  .includes("종합병원");
              });
            }

            displayPlaces(filtered, version);

            if (filtered.length === 0) {
              document.getElementById("status").textContent =
                currentMode === "general"
                  ? "이 검색 범위에서 종합병원 분류 결과를 찾지 못했습니다. 지도를 이동하거나 전체 병원 탭을 확인해 보세요."
                  : "이 검색 범위에서 병원 결과를 찾지 못했습니다. 지도를 이동한 뒤 다시 검색해 보세요.";
            } else {
              document.getElementById("status").textContent =
                "HP8 병원 검색 결과 " + filtered.length +
                "곳 · 검색 반경 약 10km";
            }
          } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            clearMarkers();
            document.getElementById("status").textContent =
              "이 주변에서 검색된 병원이 없습니다.";
          } else {
            console.error("HP8 검색 실패:", status);
            document.getElementById("status").textContent =
              "검색에 실패했습니다. API 키와 등록된 사이트 도메인을 확인해 주세요.";
          }
        },
        {
          location: center,
          radius: 10000,
          sort: kakao.maps.services.SortBy.DISTANCE,
          size: 15,
          page: 1
        }
      );
    }

    // 마커 및 목록 표시
    function displayPlaces(places, version) {
      if (version !== searchVersion) return;

      clearMarkers();

      const results = document.getElementById("results");
      results.innerHTML = "";

      places.forEach(function(place, index) {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        // 전체 병원은 초록색, 종합병원은 파란색
        const markerColor =
          currentMode === "general" ? "#2867d8" : "#16815c";

        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          title: place.place_name
        });

        // 마커 디자인
        const markerContent = document.createElement("div");
        markerContent.style.cssText = `
          width: 32px;
          height: 32px;
          border-radius: 50%;
          background: ${markerColor};
          color: white;
          border: 2px solid white;
          box-shadow: 0 2px 7px #0004;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 18px;
          font-weight: bold;
        `;
        markerContent.textContent = "+";

        marker.setImage(new kakao.maps.MarkerImage(
          "data:image/svg+xml;charset=utf-8," +
          encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
              <circle cx="18" cy="18" r="15" fill="${markerColor}" stroke="white" stroke-width="3"/>
              <path d="M15 9h6v6h6v6h-6v6h-6v-6H9v-6h6z" fill="white"/>
            </svg>`
          ),
          new kakao.maps.Size(36, 36),
          { offset: new kakao.maps.Point(18, 18) }
        ));

        markers.push(marker);

        // 병원 정보창
        kakao.maps.event.addListener(marker, "click", function() {
          showHospitalInfo(place, marker);
        });

        // 병원 목록 항목
        const item = document.createElement("button");
        item.className = "hospital";

        const name = document.createElement("strong");
        name.textContent = (index + 1) + ". " + place.place_name;

        const category = document.createElement("span");
        category.textContent =
          place.category_name || "병원";

        const address = document.createElement("span");
        address.textContent =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        item.appendChild(name);
        item.appendChild(category);
        item.appendChild(address);

        item.addEventListener("click", function() {
          map.panTo(position);
          map.setLevel(3);
          showHospitalInfo(place, marker);
        });

        results.appendChild(item);
      });

      document.getElementById("listTitle").textContent =
        currentMode === "general" ? "종합병원 목록" : "주변 병원 목록";
    }

    // 병원 정보창 표시
    function showHospitalInfo(place, marker) {
      const address =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      const safeName = escapeHTML(place.place_name);
      const safeAddress = escapeHTML(address);

      // 카카오맵 장소 상세 페이지로 연결
      const mapUrl = place.place_url ||
        "https://map.kakao.com/link/search/" +
        encodeURIComponent(place.place_name);

      const content = `
        <div class="info-window">
          <strong>${safeName}</strong>
          <p>주소: ${safeAddress}</p>
          <p>응급실 운영 여부: 별도 확인 필요</p>
          <a href="${escapeHTML(mapUrl)}"
             target="_blank"
             rel="noopener noreferrer">
            카카오맵에서 상세 정보 보기 ↗
          </a>
        </div>
      `;

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // HTML 삽입 시 문자 처리
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, function(char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    // 기존 마커 제거
    function clearMarkers() {
      markers.forEach(function(marker) {
        marker.setMap(null);
      });

      markers = [];
      infoWindow.close();
    }

    // 탭 전환
    function changeMode(mode) {
      currentMode = mode;

      document.getElementById("allBtn").classList.toggle(
        "active", mode === "all"
      );

      document.getElementById("generalBtn").classList.toggle(
        "active", mode === "general"
      );

      searchHospitals();
    }

    // 현재 위치로 이동
    function moveToMyLocation() {
      if (!navigator.geolocation) {
        alert("이 브라우저에서는 위치 기능을 사용할 수 없습니다.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          userPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.setCenter(userPosition);
          map.setLevel(5);
          searchHospitals();
        },
        function() {
          alert(
            "현재 위치를 가져오지 못했습니다. 브라우저의 위치 권한을 확인해 주세요."
          );
        },
        {
          enableHighAccuracy: true,
          timeout: 10000
        }
      );
    }

    // 교통정보 레이어 켜기 / 끄기
    function toggleTraffic() {
      trafficEnabled = !trafficEnabled;

      if (trafficEnabled) {
        map.addOverlayMapTypeId(
          kakao.maps.MapTypeId.TRAFFIC
        );
      } else {
        map.removeOverlayMapTypeId(
          kakao.maps.MapTypeId.TRAFFIC
        );
      }

      document.getElementById("trafficBtn").textContent =
        trafficEnabled
          ? "🚦 교통정보 끄기"
          : "🚦 교통정보 켜기";
    }
  </script>
</body>
</html>
