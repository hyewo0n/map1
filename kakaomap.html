
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>응급 의료 지도</title>

  <!-- 카카오 JavaScript 키 입력 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=dbebb8cfdf21e6d5fe4adcd94d3a027f&libraries=services"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #24372f;
      background: #f3f7f4;
    }

    header {
      padding: 22px;
      color: white;
      background: #176b52;
    }

    header h1 {
      margin: 0 0 7px;
      font-size: 25px;
    }

    header p {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      padding: 14px 18px;
      background: white;
      border-bottom: 1px solid #dfe8e1;
    }

    button {
      padding: 11px 15px;
      border: 1px solid #d4e1d8;
      border-radius: 9px;
      background: white;
      color: #315747;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    button:hover {
      background: #eaf4ed;
    }

    button.active {
      color: white;
      background: #176b52;
      border-color: #176b52;
    }

    #pharmacyBtn.active {
      background: #3476cf;
      border-color: #3476cf;
    }

    .main {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 15px;
      padding: 15px;
      height: calc(100vh - 135px);
      min-height: 480px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background: white;
      border: 1px solid #e0e8e2;
      border-radius: 13px;
    }

    .sidebar-heading {
      padding: 17px;
      border-bottom: 1px solid #e8eee9;
    }

    .sidebar-heading h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    #status {
      color: #65766b;
      font-size: 13px;
      line-height: 1.6;
    }

    #results {
      overflow-y: auto;
      padding: 8px;
    }

    .place-item {
      display: block;
      width: 100%;
      margin-bottom: 7px;
      padding: 13px;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 9px;
    }

    .place-item:hover {
      border-color: #cfe2d4;
    }

    .place-item strong {
      display: block;
      margin-bottom: 6px;
      color: #254b3b;
      font-size: 14px;
    }

    .place-item span {
      display: block;
      color: #68796e;
      font-size: 12px;
      line-height: 1.6;
    }

    .map-wrap {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid #e0e8e2;
      border-radius: 13px;
      background: #e7eee8;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-note {
      position: absolute;
      z-index: 2;
      bottom: 12px;
      left: 12px;
      max-width: calc(100% - 24px);
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 8px #0002;
      font-size: 12px;
      line-height: 1.6;
    }

    .info-window {
      width: 225px;
      padding: 12px;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    .info-window strong {
      display: block;
      margin-bottom: 8px;
      color: #176b52;
      font-size: 15px;
    }

    .info-window p {
      margin: 5px 0;
      color: #4e6055;
      font-size: 12px;
      line-height: 1.6;
    }

    .info-window a {
      display: inline-block;
      margin-top: 8px;
      color: #176b52;
      font-size: 13px;
      font-weight: bold;
    }

    @media (max-width: 760px) {
      .main {
        grid-template-columns: 1fr;
        height: auto;
      }

      .map-wrap {
        height: 50vh;
        min-height: 300px;
        grid-row: 1;
      }

      .sidebar {
        height: 350px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🩺 응급 의료 지도</h1>
    <p>현재 위치 주변의 병원과 약국을 확인하고 교통정보를 살펴보세요.</p>
  </header>

  <nav class="toolbar">
    <button id="hospitalBtn" class="active"
      onclick="changeCategory('hospital')">
      🏥 병원
    </button>

    <button id="pharmacyBtn"
      onclick="changeCategory('pharmacy')">
      💊 약국
    </button>

    <button onclick="moveToMyLocation()">
      📍 내 위치
    </button>

    <button id="trafficBtn" onclick="toggleTraffic()">
      🚦 교통정보 켜기
    </button>
  </nav>

  <main class="main">
    <section class="sidebar">
      <div class="sidebar-heading">
        <h2 id="listTitle">주변 병원</h2>
        <div id="status">현재 위치를 확인하고 있습니다.</div>
      </div>
      <div id="results"></div>
    </section>

    <section class="map-wrap">
      <div id="map"></div>
      <div class="map-note">
        마커를 누르면 장소 정보와 카카오맵 링크를 확인할 수 있어요.
        응급실 운영 여부는 별도로 확인해야 합니다.
      </div>
    </section>
  </main>

  <script>
    // 카테고리 코드
    const CATEGORY_CODES = {
      hospital: "HP8",
      pharmacy: "PM9"
    };

    // 현재 상태
    let currentCategory = "hospital";
    let userPosition = null;
    let trafficEnabled = false;
    let searchVersion = 0;

    let markers = [];
    let infoWindow;

    // 위치를 가져오지 못했을 때 사용할 기본 위치: 서울시청
    const defaultPosition = new kakao.maps.LatLng(
      37.5665,
      126.9780
    );

    // 지도 초기화
    const map = new kakao.maps.Map(
      document.getElementById("map"),
      {
        center: defaultPosition,
        level: 5
      }
    );

    const placesService = new kakao.maps.services.Places(map);

    infoWindow = new kakao.maps.InfoWindow({
      zIndex: 10
    });

    // 페이지 시작 시 현재 위치 확인
    requestCurrentLocation();

    // 현재 위치 요청
    function requestCurrentLocation() {
      setStatus("현재 위치를 확인하고 있습니다.");

      if (!navigator.geolocation) {
        setStatus("위치 기능을 지원하지 않아 서울시청을 기준으로 검색합니다.");
        searchNearbyPlaces();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          userPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.setCenter(userPosition);
          map.setLevel(5);

          searchNearbyPlaces();
        },
        function(error) {
          console.warn("위치 확인 실패:", error);

          setStatus(
            "현재 위치를 가져오지 못해 서울시청을 기준으로 검색합니다."
          );

          map.setCenter(defaultPosition);
          searchNearbyPlaces();
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 현재 위치 주변 병원 또는 약국 검색
    function searchNearbyPlaces() {
      const version = ++searchVersion;

      const center = userPosition || map.getCenter();
      const categoryCode = CATEGORY_CODES[currentCategory];

      const categoryName =
        currentCategory === "hospital" ? "병원" : "약국";

      clearMarkers();

      document.getElementById("results").innerHTML = "";
      document.getElementById("listTitle").textContent =
        "주변 " + categoryName;

      setStatus(categoryName + "을(를) 검색하고 있습니다...");

      // 핵심: 선택한 탭에 해당하는 카테고리 코드만 검색
      placesService.categorySearch(
        categoryCode,
        function(data, status, pagination) {
          // 이전 검색의 응답은 표시하지 않음
          if (version !== searchVersion) return;

          if (status === kakao.maps.services.Status.OK) {
            console.log(
              categoryName + " 카테고리 코드:",
              categoryCode
            );
            console.log("검색 결과:", data);

            displayPlaces(data, version);

            setStatus(
              "검색 결과 " + data.length + "곳 · 반경 약 10km"
            );
          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            setStatus(
              "주변 10km에서 검색 결과를 찾지 못했습니다."
            );
          } else {
            console.error("카테고리 검색 실패:", status);

            setStatus(
              "검색에 실패했습니다. API 키와 사이트 등록 설정을 확인해 주세요."
            );
          }
        },
        {
          location: center,
          radius: 10000,
          sort: kakao.maps.services.SortBy.DISTANCE,
          size: 15,
          page: 1
        }
      );
    }

    // 지도 마커와 목록 생성
    function displayPlaces(places, version) {
      if (version !== searchVersion) return;

      const results = document.getElementById("results");
      results.innerHTML = "";

      const isHospital = currentCategory === "hospital";
      const markerColor = isHospital ? "#16815c" : "#3476cf";

      places.forEach(function(place, index) {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          title: place.place_name
        });

        // 병원과 약국을 색상으로 구분
        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg"
               width="36" height="36" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="15"
                    fill="${markerColor}"
                    stroke="white" stroke-width="3"/>
            ${
              isHospital
                ? '<path d="M15 9h6v6h6v6h-6v6h-6v-6H9v-6h6z" fill="white"/>'
                : '<path d="M12 9h12v18H12z" fill="white"/><path d="M9 15h18v6H9z" fill="white"/>'
            }
          </svg>
        `;

        marker.setImage(
          new kakao.maps.MarkerImage(
            "data:image/svg+xml;charset=utf-8," +
              encodeURIComponent(svg),
            new kakao.maps.Size(36, 36),
            {
              offset: new kakao.maps.Point(18, 18)
            }
          )
        );

        markers.push(marker);

        kakao.maps.event.addListener(marker, "click", function() {
          showPlaceInfo(place, marker);
        });

        // 목록 항목
        const item = document.createElement("button");
        item.className = "place-item";

        const name = document.createElement("strong");
        name.textContent = (index + 1) + ". " + place.place_name;

        const category = document.createElement("span");
        category.textContent =
          place.category_name || categoryNameFallback();

        const address = document.createElement("span");
        address.textContent =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        item.appendChild(name);
        item.appendChild(category);
        item.appendChild(address);

        item.addEventListener("click", function() {
          map.panTo(position);
          map.setLevel(3);
          showPlaceInfo(place, marker);
        });

        results.appendChild(item);
      });
    }

    function categoryNameFallback() {
      return currentCategory === "hospital" ? "병원" : "약국";
    }

    // 정보창 표시
    function showPlaceInfo(place, marker) {
      const address =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      const safeName = escapeHTML(place.place_name);
      const safeAddress = escapeHTML(address);

      const mapUrl = place.place_url ||
        "https://map.kakao.com/link/search/" +
        encodeURIComponent(place.place_name);

      const content = `
        <div class="info-window">
          <strong>${safeName}</strong>
          <p>주소: ${safeAddress}</p>
          <p>${
            currentCategory === "hospital"
              ? "응급실 운영 여부는 별도로 확인해 주세요."
              : "운영시간과 조제 가능 여부를 확인해 주세요."
          }</p>
          <a href="${escapeHTML(mapUrl)}"
             target="_blank"
             rel="noopener noreferrer">
            카카오맵에서 상세 정보 보기 ↗
          </a>
        </div>
      `;

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // HTML 특수문자 처리
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, function(char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    // 기존 마커 삭제
    function clearMarkers() {
      markers.forEach(function(marker) {
        marker.setMap(null);
      });

      markers = [];

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // 병원 / 약국 탭 전환
    function changeCategory(category) {
      currentCategory = category;

      document.getElementById("hospitalBtn").classList.toggle(
        "active",
        category === "hospital"
      );

      document.getElementById("pharmacyBtn").classList.toggle(
        "active",
        category === "pharmacy"
      );

      searchNearbyPlaces();
    }

    // 현재 위치로 이동
    function moveToMyLocation() {
      requestCurrentLocation();
    }

    // 교통정보 켜기 / 끄기
    function toggleTraffic() {
      trafficEnabled = !trafficEnabled;

      if (trafficEnabled) {
        map.addOverlayMapTypeId(
          kakao.maps.MapTypeId.TRAFFIC
        );
      } else {
        map.removeOverlayMapTypeId(
          kakao.maps.MapTypeId.TRAFFIC
        );
      }

      document.getElementById("trafficBtn").textContent =
        trafficEnabled
          ? "🚦 교통정보 끄기"
          : "🚦 교통정보 켜기";
    }

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }
  </script>
</body>
</html>
